# ProteinView configuration -- every setting, at its built-in default
# =============================================================================
#
# Copy this file to have it picked up automatically:
#
#     mkdir -p ~/.config/proteinview
#     cp docs/config.example.toml ~/.config/proteinview/config.toml
#
# or point at one explicitly, which is how you keep several around:
#
#     proteinview structure.pdb --config ~/my-configs/paper-figures.toml
#
# ProteinView reads $XDG_CONFIG_HOME/proteinview/config.toml, falling back to
# ~/.config/proteinview/config.toml. An older palette.toml in the same directory
# is still read when no config.toml is there, so a file written when this held
# only colors keeps working, and --palette still works as an alias for --config.
#
# HOW TO READ THIS FILE
#
#   * Every key is optional. Anything you leave out keeps its built-in default,
#     so a file containing nothing but one color is perfectly valid -- you do
#     not need to copy the whole thing to change one line.
#
#   * Every value below IS the built-in default. Copying this file wholesale
#     gives you exactly the stock appearance, so you can edit downward from a
#     working file rather than guessing at what a key expects.
#
#   * Colors are six hexadecimal digits, with or without a leading '#', in
#     either case: "FF0080", "#ff0080" and "Ff0080" are the same color.
#
#   * Unknown keys are an error rather than being ignored, so a typo tells you
#     at startup instead of silently doing nothing. So does an out-of-range
#     number, and the message names the key.
#
# WHAT IS IN HERE
#
#   Colors      the sections down to [selection]: every fixed color drawn
#   [fog]       how much distance dims a structure
#   [defaults]  which modes ProteinView opens in
#   [[palette]] extra named palettes, cycled with `p` at runtime
#
# =============================================================================


# =============================================================================
# COLORS
# =============================================================================
# These sections are the "default" palette -- the one ProteinView starts on and
# the one `p` cycles back around to. Extra palettes go in [[palette]] blocks at
# the bottom of this file, and each takes the same sections as these.

# --- Structure scheme (the default, keyed by secondary structure) ------------
[structure]
helix = "FF0080"
sheet = "FFC800"
turn  = "6080FF"
coil  = "00CC00"

# --- Nucleic acid bases ------------------------------------------------------
# Used for DNA/RNA residues under the Structure scheme.
[nucleotide]
adenine  = "DC3C3C"
uracil   = "3C3CDC"
thymine  = "3C3CDC"
guanine  = "3CB43C"
cytosine = "DCC828"
inosine  = "9664B4"

# --- Chain scheme ------------------------------------------------------------
# Cycled by chain id. Order matters, and the list replaces the default outright
# rather than merging, so give it as many colors as you want in the rotation.
[chain]
colors = [
  "00B4FF",
  "FF6400",
  "00DC64",
  "FF3296",
  "B464FF",
  "FFDC00",
  "00C8C8",
  "FF9696",
]

# --- Element scheme (CPK) ----------------------------------------------------
[element]
# Color for any element not listed below.
fallback = "C8C8C8"

# These *merge* onto the built-in table, so overriding carbon leaves every other
# element alone. Keys are element symbols and are matched case-insensitively.
[element.symbols]
C  = "909090"
N  = "3050F8"
O  = "FF0D0D"
S  = "FFFF30"
H  = "FFFFFF"
P  = "FF8000"
FE = "E06633"
MG = "00B400"
ZN = "7D80B0"
CA = "3DFF00"
MN = "9C7AC7"
CO = "F090A0"
CU = "C88033"
NI = "50D050"
CL = "1FF01F"
BR = "A62929"

# --- pLDDT scheme (AlphaFold confidence bands) -------------------------------
[plddt]
very_high = "0053D6"  # >= 90
high      = "65CBF3"  # >= 70
low       = "FFDB13"  # >= 50
very_low  = "FF7D45"  # <  50

# --- B-factor scheme ---------------------------------------------------------
# Endpoints of a linear gradient across roughly the 5..80 B-factor range.
[bfactor]
low  = "0000FF"
high = "FF0000"

# --- Interface highlighting ('f') --------------------------------------------
[interface]
focus_contact   = "00FF64"  # focus chain, touching a partner
focus_other     = "28643C"  # focus chain, away from the interface
partner_contact = "FFA500"  # partner chain, touching the focus chain
partner_other   = "64503C"  # partner chain, away from the interface
ligand          = "FFFFFF"  # ligands, kept bright so they stay visible

# --- Small molecules ---------------------------------------------------------
[ligand]
ligand  = "FF00FF"
ion     = "00FFFF"
rainbow = "FF00FF"  # ligands under the Rainbow scheme

# --- Rainbow scheme ----------------------------------------------------------
# The Rainbow scheme runs a ramp along each chain, N-terminus to C-terminus.
# Leave `colors` out and it uses the built-in HSV sweep (blue -> red). Give it
# stops and they replace the sweep, spread evenly and blended between, so eight
# colors make seven gradients rather than eight bands.
#
# Each chain gets the whole ramp, so in a multi-chain structure every chain runs
# the full sweep rather than each taking a slice of it.
# [rainbow]
# colors = ["4A00E0", "00B4FF", "00CC66", "FFD700", "FF4500"]

# --- Background --------------------------------------------------------------
# Paints empty space. Left out, the background stays transparent: the terminal's
# own background shows through, and a snapshot PNG keeps its alpha channel.
# Setting it makes snapshots opaque, which is usually what you want for a figure.
#
# A background pairs with [fog]: fog fades distant material toward `fog.color`,
# so a background very far from that color leaves the far side of a structure
# floating rather than receding. Setting them to the same hue is a good start.
# [background]
# color = "1A1B26"

# --- Sequence panel selection ('S') ------------------------------------------
# Residues picked in the sequence panel.  Carbons of the ball-and-stick overlay
# take `carbon`; every other element keeps its CPK color, so a picked residue
# still reads as itself.
[selection]
carbon = "00E68C"  # ball-and-stick carbons of picked residues
marker = "00E68C"  # marker sphere shown when ball-and-stick is off ('b')
cursor = "FFC800"  # the sequence panel's cursor cell


# =============================================================================
# DEPTH FOG
# =============================================================================
# How much a pixel fades toward `color` as it recedes. Applies to every
# framebuffer render (HD, HDplus, FullHD, snapshots and the panel server);
# braille has no depth buffer to fog.
#
# `strength` is the blend at the far side of a structure no deeper than
# `reference_depth`. Past that depth the ramp bends toward the front and starts
# draining chroma, both scaled by how much deeper the structure is, so a
# ribosome stays readable where a flat ramp turns it into confetti. Those extra
# terms vanish at the reference depth, so a small protein only ever sees
# `strength`.
#
# Fog too heavy? Lower `strength` for small structures, `max_strength` for large
# ones, and `desaturation` if distant material is losing too much color.
# `strength = 0.0` turns fog off entirely.
[fog]
color           = "283246"  # what distant pixels fade toward
strength        = 0.35      # blend at the far plane, 0.0..=1.0
max_strength    = 0.85      # ceiling once depth scaling kicks in
reference_depth = 55.0      # angstroms; `strength` applies as given at this depth
curve_gain      = 2.0       # how sharply a deep structure's contrast goes to the front
desaturation    = 1.0       # chroma drained at the far plane of a deep structure


# =============================================================================
# STARTUP DEFAULTS
# =============================================================================
# What ProteinView opens with. Each key is the default for the flag or key of
# the same name, and the flag still wins when you pass one.
#
# Leaving a key out is not the same as writing its built-in value: an omitted
# key lets the file-type heuristics run (an .xyz file opens as element-colored
# wireframe), while writing one down means you meant it, and it stands.
[defaults]
render         = "braille"    # braille | halfblock (hd) | hdplus (hd+) | fullhd (pixel)
mode           = "cartoon"    # cartoon | backbone | wireframe
color          = "structure"  # structure | chain | element | bfactor | rainbow | plddt
ball_and_stick = true         # picked residues as ball-and-stick rather than a marker ('b')
ligands        = true         # draw ligands and ions ('g')
auto_rotate    = false        # spin the structure on startup (space)

# Which named palette to open on. "default" is the colors written above; any
# other name has to match a [[palette]] below, or ProteinView refuses to start
# rather than opening in the wrong colors. --palette-name overrides this.
# palette = "ocean"


# =============================================================================
# NAMED PALETTES
# =============================================================================
# Extra palettes, cycled with `p` (and `P` to go back) while ProteinView is
# running. The status bar names the one you are on, and `--palette-name ocean`
# picks one up front -- which is how you get a snapshot in a chosen palette,
# since a snapshot has no keyboard.
#
# The order below is the cycling order. The colors at the top of this file are
# always first, under the name "default", so `p` goes:
#
#     default -> ocean -> print -> aurora -> default -> ...
#
# Each [[palette]] takes exactly the same sections as the top of this file, with
# a `palette.` prefix: [palette.structure], [palette.chain], [palette.element],
# [palette.selection], and so on. Two rules worth knowing:
#
#   * A named palette is a WHOLE palette, not a patch on the colors above. What
#     it does not mention comes from the built-in defaults, not from your
#     top-level [structure]. That way reading one block tells you what it draws.
#
#   * `name` is required, and no two palettes may share one -- including
#     "default", which the top-level colors already own.
#
# The two below are worked examples. Delete them, edit them, or add your own.

# --- ocean: cool blues and teals, easier on the eyes for long sessions -------
[[palette]]
name = "ocean"

[palette.structure]
helix = "0091EA"   # deep blue
sheet = "00BFA5"   # teal
turn  = "5C6BC0"   # indigo
coil  = "80DEEA"   # pale cyan

[palette.chain]
colors = [
  "0091EA",
  "00BFA5",
  "7E57C2",
  "26C6DA",
  "5C6BC0",
  "4DB6AC",
]

[palette.selection]
carbon = "FFD54F"  # warm against a cool structure, so a pick stands out
marker = "FFD54F"
cursor = "FFECB3"

# Note there is no [palette.fog] or [palette.defaults]: fog and startup defaults
# are settings for the session, not properties of a palette, so they stay global
# and cycling `p` leaves them alone.

# --- print: high-contrast greys for figures and screenshots ------------------
# A short palette: everything it leaves out -- elements, pLDDT bands, interface
# colors -- keeps its built-in value, which is usually what you want.
[[palette]]
name = "print"

[palette.structure]
helix = "1A1A1A"
sheet = "5C5C5C"
turn  = "8C8C8C"
coil  = "BFBFBF"

[palette.chain]
colors = ["1A1A1A", "5C5C5C", "8C8C8C", "BFBFBF"]

[palette.selection]
carbon = "D32F2F"  # the one bit of color, so a selection is unmistakable
marker = "D32F2F"
cursor = "D32F2F"

# --- aurora: a themed palette, background and rainbow ramp included ----------
# A palette is not only the structure colors: it carries its own [rainbow] ramp
# and [background] too, so switching to it with `p` re-themes the whole view.
# Pair it with --color rainbow (or `c` until Rainbow comes up) to see the ramp.
[[palette]]
name = "aurora"

[palette.background]
color = "#1a1b26"

[palette.rainbow]
colors = [
  "#A3E8C7",  # N-terminus: mint
  "#8EDBD8",
  "#8FCBF3",
  "#A5B4F5",
  "#C5A9F0",
  "#E5A3E0",
  "#F5A7C0",
  "#F7C9A0",  # C-terminus: peach
]

# Fog is global rather than per-palette, but a dark background wants a fog color
# near it -- otherwise distant material fades toward a color the background does
# not share. For this one, put `color = "1A1B26"` in the [fog] section above.

[palette.structure]
helix = "8FCBF3"
sheet = "A3E8C7"
turn  = "C5A9F0"
coil  = "F5A7C0"

[palette.chain]
colors = ["A3E8C7", "8FCBF3", "C5A9F0", "F5A7C0", "F7C9A0", "8EDBD8"]

[palette.selection]
carbon = "F7C9A0"
marker = "F7C9A0"
cursor = "E5A3E0"
