# ProteinView configuration
#
# Copy to ~/.config/proteinview/config.toml to have it picked up automatically,
# or point at it explicitly:
#
#     proteinview structure.pdb --config docs/config.example.toml
#
# Every key is optional. Anything you leave out keeps its built-in default, so a
# file containing nothing but a single color is perfectly valid. Colors are six
# hexadecimal digits, with or without a leading '#', in either case.
#
# Unknown keys are an error rather than being ignored, so a typo tells you
# instead of silently doing nothing.
#
# An older ~/.config/proteinview/palette.toml is still read when no config.toml
# is there, so a file written when this held only colors keeps working.

# --- Structure scheme (the default, keyed by secondary structure) ------------
[structure]
helix = "FF0080"
sheet = "FFC800"
turn  = "6080FF"
coil  = "00CC00"

# --- Nucleic acid bases ------------------------------------------------------
# Used for DNA/RNA residues under the Structure scheme.
[nucleotide]
adenine  = "DC3C3C"
uracil   = "3C3CDC"
thymine  = "3C3CDC"
guanine  = "3CB43C"
cytosine = "DCC828"
inosine  = "9664B4"

# --- Chain scheme ------------------------------------------------------------
# Cycled by chain id. Order matters, and the list replaces the default outright
# rather than merging, so give it as many colors as you want in the rotation.
[chain]
colors = [
  "00B4FF",
  "FF6400",
  "00DC64",
  "FF3296",
  "B464FF",
  "FFDC00",
  "00C8C8",
  "FF9696",
]

# --- Element scheme (CPK) ----------------------------------------------------
[element]
# Color for any element not listed below.
fallback = "C8C8C8"

# These *merge* onto the built-in table, so overriding carbon leaves every other
# element alone. Keys are element symbols and are matched case-insensitively.
[element.symbols]
C  = "909090"
N  = "3050F8"
O  = "FF0D0D"
S  = "FFFF30"
H  = "FFFFFF"
P  = "FF8000"
FE = "E06633"
MG = "00B400"
ZN = "7D80B0"
CA = "3DFF00"
MN = "9C7AC7"
CO = "F090A0"
CU = "C88033"
NI = "50D050"
CL = "1FF01F"
BR = "A62929"

# --- pLDDT scheme (AlphaFold confidence bands) -------------------------------
[plddt]
very_high = "0053D6"  # >= 90
high      = "65CBF3"  # >= 70
low       = "FFDB13"  # >= 50
very_low  = "FF7D45"  # <  50

# --- B-factor scheme ---------------------------------------------------------
# Endpoints of a linear gradient across roughly the 5..80 B-factor range.
[bfactor]
low  = "0000FF"
high = "FF0000"

# --- Interface highlighting ('f') --------------------------------------------
[interface]
focus_contact   = "00FF64"  # focus chain, touching a partner
focus_other     = "28643C"  # focus chain, away from the interface
partner_contact = "FFA500"  # partner chain, touching the focus chain
partner_other   = "64503C"  # partner chain, away from the interface
ligand          = "FFFFFF"  # ligands, kept bright so they stay visible

# --- Small molecules ---------------------------------------------------------
[ligand]
ligand  = "FF00FF"
ion     = "00FFFF"
rainbow = "FF00FF"  # ligands under the Rainbow scheme

# --- Sequence panel selection ('S') ------------------------------------------
# Residues picked in the sequence panel.  Carbons of the ball-and-stick overlay
# take `carbon`; every other element keeps its CPK color, so a picked residue
# still reads as itself.
[selection]
carbon = "00E68C"  # ball-and-stick carbons of picked residues
marker = "00E68C"  # marker sphere shown when ball-and-stick is off ('b')
cursor = "FFC800"  # the sequence panel's cursor cell

# --- Depth fog ---------------------------------------------------------------
# How much a pixel fades toward `color` as it recedes. Applies to every
# framebuffer render (HD, HDplus, FullHD, snapshots and the panel server);
# braille has no depth buffer to fog.
#
# `strength` is the blend at the far side of a structure no deeper than
# `reference_depth`. Past that depth the ramp bends toward the front and starts
# draining chroma, both scaled by how much deeper the structure is, so a
# ribosome stays readable where a flat ramp turns it into confetti. Those extra
# terms vanish at the reference depth, so a small protein only ever sees
# `strength`.
#
# Fog too heavy? Lower `strength` for small structures, `max_strength` for large
# ones, and `desaturation` if distant material is losing too much color.
# `strength = 0.0` turns fog off entirely.
[fog]
color           = "283246"  # what distant pixels fade toward
strength        = 0.35      # blend at the far plane, 0.0..=1.0
max_strength    = 0.85      # ceiling once depth scaling kicks in
reference_depth = 55.0      # angstroms; `strength` applies as given at this depth
curve_gain      = 2.0       # how sharply a deep structure's contrast goes to the front
desaturation    = 1.0       # chroma drained at the far plane of a deep structure

# --- Startup defaults --------------------------------------------------------
# What ProteinView opens with. Each key is the default for the flag or key of
# the same name, and the flag still wins when you pass one.
#
# Leaving a key out is not the same as writing its built-in value: an omitted
# key lets the file-type heuristics run (an .xyz file opens as element-colored
# wireframe), while writing one down means you meant it, and it stands.
[defaults]
render         = "braille"    # braille | halfblock (hd) | hdplus (hd+) | fullhd (pixel)
mode           = "cartoon"    # cartoon | backbone | wireframe
color          = "structure"  # structure | chain | element | bfactor | rainbow | plddt
ball_and_stick = true         # picked residues as ball-and-stick rather than a marker ('b')
ligands        = true         # draw ligands and ions ('g')
auto_rotate    = false        # spin the structure on startup (space)
